<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ DEFAULT BRAND TITLE FOR GOOGLE SEARCH -->
  <title>Sri Aditya Enterprises</title>

  <meta name="description"
    content="Sri Aditya Enterprises – Trusted furniture showroom in Hyderabad, serving quality furniture solutions for over three decades." />
  <meta name="author" content="Sri Aditya Enterprises" />

  <!-- ✅ PREVENT STALE BROWSER CACHE (ALWAYS LOAD LATEST DEPLOYMENT) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- ✅ FAVICON -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="theme-color" content="#3f5f2e" />

  <!-- ✅ OPEN GRAPH (GOOGLE / WHATSAPP / FACEBOOK) -->
  <meta property="og:title" content="Sri Aditya Enterprises" />
  <meta property="og:description"
    content="Trusted furniture showroom in Hyderabad. Crafting comfort and elegance for your home." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://sriadityaenterprises.com/logo.png" />
  <meta property="og:url" content="https://sriadityaenterprises.com" />

  <!-- ✅ TWITTER -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sri Aditya Enterprises" />
  <meta name="twitter:description" content="Trusted furniture showroom in Hyderabad." />
  <meta name="twitter:image" content="https://sriadityaenterprises.com/logo.png" />

  <!-- ✅ GOOGLE BRANDING & LOGO SCHEMA (FIXES GOOGLE SEARCH RESULTS TITLE) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sri Aditya Enterprises",
        "alternateName": ["Sri Aditya Enterprises Furniture", "Sri Aditya Enterprises Hyderabad"],
        "url": "https://sriadityaenterprises.com"
      }
    </script>
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sri Aditya Enterprises",
        "url": "https://sriadityaenterprises.com",
        "logo": "https://sriadityaenterprises.com/logo.png"
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
